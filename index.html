<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>一般閥牌價/報價查詢系統</title>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding: 15px; font-size: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 550px; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 10px; }
        .brand-header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #3182ce; padding-bottom: 15px; }
        .brand-header h1 { font-size: 24px; color: #1a365d; font-weight: bold; }
        .brand-header p { font-size: 14px; color: #4a5568; margin-top: 4px; font-weight: 500; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #2d3748; font-size: 15px; }
        select, input { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; background-color: #fff; font-size: 16px; color: #4a5568; outline: none; -webkit-appearance: none; appearance: none; }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: "▼"; font-size: 12px; color: #a0aec0; position: absolute; right: 15px; top: 15px; pointer-events: none; }
        select:focus, input:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5); }
        .result-box { margin-top: 25px; padding: 18px; border-radius: 8px; background-color: #f7fafc; border-left: 5px solid #3182ce; }
        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 16px; }
        .result-row:last-child { margin-bottom: 0; padding-top: 10px; border-top: 1px dashed #cbd5e0; }
        .price-label { font-weight: bold; color: #4a5568; }
        .price-value { font-size: 18px; font-weight: bold; color: #2d3748; }
        .final-label { font-size: 18px; font-weight: bold; color: #2d3748; }
        .final-value { font-size: 28px; font-weight: 900; color: #e53e3e; }
        .hint { font-size: 12px; color: #718096; margin-top: 4px; }
        .footer { text-align: center; font-size: 12px; color: #a0aec0; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h1>總毅實業有限公司</h1>
        <p>一般閥牌價/報價查詢系統</p>
    </div>
    
    <div class="form-group">
        <label for="materialSelect">1. 選擇材質 / 壓力系列</label>
        <div class="select-wrapper">
            <select id="materialSelect" onchange="updateProducts()">
                <option value="">-- 請選擇材質系列 --</option>
                <option value="不鏽鋼 牙口系列 (300PSI/10000PSI)">不鏽鋼 牙口系列 (300PSI/10000PSI)</option>
                <option value="不鏽鋼 法蘭/對夾口 10K">不鏽鋼 法蘭/對夾口 10K</option>
                <option value="不鏽鋼 法蘭/對夾口 16K">不鏽鋼 法蘭/對夾口 16K</option>
                <option value="砲金銅 牙口系列 (10K/16K/400PSI)">砲金銅 牙口系列 (10K/16K/400PSI)</option>
                <option value="鑄鐵 法蘭/對夾口 10K">鑄鐵 法蘭/對夾口 10K</option>
                <option value="球墨鑄鐵 法蘭/對夾口 16K">球墨鑄鐵 法蘭/對夾口 16K</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="productSelect">2. 選擇產品名稱</label>
        <div class="select-wrapper">
            <select id="productSelect" onchange="updateSizes()">
                <option value="">-- 請先選擇材質系列 --</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="sizeSelect">3. 選擇尺寸</label>
        <div class="select-wrapper">
            <select id="sizeSelect" onchange="runCalculation()">
                <option value="">-- 請先選擇產品 --</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="discountInput">4. 輸入折數 (折)</label>
        <input type="number" id="discountInput" value="100" min="0" max="100" oninput="runCalculation()" placeholder="例如：22 折請輸入 22">
        <div class="hint">提示：100 代表原始牌價，22 代表打 22 折</div>
    </div>

    <div class="result-box">
        <div class="result-row">
            <span class="price-label">原始牌價：</span>
            <span class="price-value" id="basePriceDisplay">NT$ 0</span>
        </div>
        <div class="result-row">
            <span class="final-label">折後報價：</span>
            <span class="final-value" id="finalPriceDisplay">NT$ 0</span>
        </div>
    </div>

    <div class="footer">總毅實業有限公司 • 雲端查價系統修正版</div>
</div>
