    </div>

            <select id="productSelect" onchange="updateSizes()">
                <option value="">-- 請先選擇材質系列 --</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="sizeSelect">3. 選擇尺寸</label>
        <div class="select-wrapper">
            <select id="sizeSelect" onchange="runCalculation()">
                <option value="">-- 請先選擇產品 --</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="discountInput">4. 輸入折數 (折)</label>
        <input type="number" id="discountInput" value="100" min="0" max="100" oninput="runCalculation()" placeholder="例如：65 折請輸入 65">
        <div class="hint">提示：100 代表原始牌價，65 代表打 65 折</div>
    </div>

    <div class="result-box">
        <div class="result-row">
            <span class="price-label">原始牌價：</span>
            <span class="price-value" id="basePriceDisplay">NT$ 0</span>

    </div>

</div>
