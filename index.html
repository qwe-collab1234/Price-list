function updateProducts() {
    const selectedMat = matSelect.value;
    prodSelect.innerHTML = '<option value="">-- 請選擇產品品名 --</option>';
    sizeSelect.innerHTML = '<option value="">-- 請先選擇產品 --</option>';
    clearDisplays();
    if (!selectedMat) return;

    for (var i = 0; i < valveData.length; i++) {
        if (valveData[i].mat === selectedMat) {
            var option = document.createElement('option');
            option.value = valveData[i].prod;
            option.textContent = valveData[i].prod;
            prodSelect.appendChild(option);
        }
    }
}

function updateSizes() {
    const selectedMat = matSelect.value;
    const selectedProd = prodSelect.value;
    sizeSelect.innerHTML = '<option value="">-- 請選擇尺寸 --</option>';
    clearDisplays();
    if (!selectedMat || !selectedProd) return;

    var targetItem = null;
    for (var i = 0; i < valveData.length; i++) {
        if (valveData[i].mat === selectedMat && valveData[i].prod === selectedProd) {
            targetItem = valveData[i];
            break;
        }
    }
    if (!targetItem) return;

    for (var j = 0; j < orderedSizeList.length; j++) {
        var currentSize = orderedSizeList[j];
        if (targetItem.sizes[currentSize] !== undefined) {
            var option = document.createElement('option');
            option.value = currentSize;
            option.textContent = currentSize + '" 吋';
            sizeSelect.appendChild(option);
        }
    }
}

function runCalculation() {
    const selectedMat = matSelect.value;
    const selectedProd = prodSelect.value;
    const selectedSize = sizeSelect.value;
    const discValue = discInput.value;

    if (!selectedMat || !selectedProd || !selectedSize) {
        clearDisplays();
        return;
    }

    var targetItem = null;
    for (var i = 0; i < valveData.length; i++) {
        if (valveData[i].mat === selectedMat && valveData[i].prod === selectedProd) {
            targetItem = valveData[i];
            break;
        }
    }
    if (!targetItem) return;

    const originalPrice = targetItem.sizes[selectedSize];
    if (isNaN(originalPrice)) {
        baseDisplay.textContent = originalPrice;
        finalDisplay.textContent = originalPrice;
        return;
    }

    const factor = discValue !== "" ? parseFloat(discValue) : 100;
    const computedPrice = Math.round(originalPrice * (factor / 100));

    baseDisplay.textContent = "NT$ " + Number(originalPrice).toLocaleString();
    finalDisplay.textContent = "NT$ " + computedPrice.toLocaleString();
}

function clearDisplays() {
    baseDisplay.textContent = "NT$ 0";
    finalDisplay.textContent = "NT$ 0";
}
</script>
