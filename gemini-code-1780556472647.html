<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一般閥牌價/報價查詢系統</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background-color: #f7fafc; color: #2d3748; padding: 16px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: #ffffff; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-top: 8px; }
        .brand-header { text-align: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 2px solid #edf2f7; }
        .brand-header h1 { font-size: 20px; color: #1a365d; font-weight: bold; }
        .brand-header p { font-size: 13px; color: #718096; margin-top: 4px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #4a5568; font-size: 14px; }
        select, input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 10px; background-color: #fff; font-size: 16px; color: #2d3748; outline: none; -webkit-appearance: none; appearance: none; transition: all 0.2s; }
        .select-wrapper { position: relative; }
        .select-wrapper::after { content: "▼"; font-size: 12px; color: #a0aec0; position: absolute; right: 16px; top: 18px; pointer-events: none; }
        select:focus, input:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.2); }
        .result-box { margin-top: 28px; padding: 20px; border-radius: 12px; background: linear-gradient(145deg, #ffffff, #f8fafc); border: 1px solid #e2e8f0; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); }
        .result-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 15px; }
        .result-row:last-child { margin-bottom: 0; padding-top: 14px; border-top: 1px dashed #e2e8f0; }
        .price-label { font-weight: 500; color: #718096; }
        .price-value { font-size: 18px; font-weight: 600; color: #4a5568; }
        .final-label { font-size: 16px; font-weight: bold; color: #1a365d; }
        .final-value { font-size: 30px; font-weight: 800; color: #dd6b20; }
        .hint { font-size: 12px; color: #a0aec0; margin-top: 6px; }
        .footer { text-align: center; font-size: 12px; color: #cbd5e0; margin-top: 24px; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-header">
        <h1>總毅實業有限公司</h1>
        <p>一般閥牌價/報價查詢系統</p>
    </div>
    
    <div class="form-group">
        <label for="materialSelect">1. 選擇材質 / 壓力系列</label>
        <div class="select-wrapper">
            <select id="materialSelect" onchange="updateProducts()">
                <option value="">-- 請選擇材質系列 --</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="productSelect">2. 選擇產品名稱</label>
        <div class="select-wrapper">
            <select id="productSelect" onchange="updateSizes()">
                <option value="">-- 請先選擇材質系列 --</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="sizeSelect">3. 選擇尺寸</label>
        <div class="select-wrapper">
            <select id="sizeSelect" onchange="runCalculation()">
                <option value="">-- 請先選擇產品 --</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label for="discountInput">4. 輸入折數 (例如：22折請輸入 22)</label>
        <input type="number" id="discountInput" value="100" min="0" max="100" oninput="runCalculation()" placeholder="100 代表不打折">
        <div class="hint">提示：輸入 22 代表打 22 折，輸入 100 代表原始牌價</div>
    </div>

    <div class="result-box">
        <div class="result-row">
            <span class="price-label">原始牌價</span>
            <span class="price-value" id="basePriceDisplay">NT$ 0</span>
        </div>
        <div class="result-row">
            <span class="final-label">折後報價</span>
            <span class="final-value" id="finalPriceDisplay">NT$ 0</span>
        </div>
    </div>

    <div class="footer">總毅實業有限公司 • 雲端連線快查版</div>
</div>

<script>
let valveData = [];
const orderedSizeList = ["1/2", "3/4", "1", "1-1/4", "1-1/2", "2", "2-1/2", "3", "4", "5", "6", "8", "10", "12"];

const matSelect = document.getElementById('materialSelect');
const prodSelect = document.getElementById('productSelect');
const sizeSelect = document.getElementById('sizeSelect');
const discInput = document.getElementById('discountInput');
const baseDisplay = document.getElementById('basePriceDisplay');
const finalDisplay = document.getElementById('finalPriceDisplay');

// 初始化：讀取資料庫
async function initSystem() {
    try {
        const response = await fetch('data.json');
        valveData = await response.json();
        
        const materials = [...new Set(valveData.map(item => item.mat))];
        materials.forEach(mat => {
            let option = document.createElement('option');
            option.value = mat;
            option.textContent = mat;
            matSelect.appendChild(option);
        });
    } catch (error) {
        alert("資料庫連線失敗，請檢查 data.json 檔案是否存在！");
    }
}

function updateProducts() {
    const selectedMat = matSelect.value;
    prodSelect.innerHTML = '<option value="">-- 請選擇產品品名 --</option>';
    sizeSelect.innerHTML = '<option value="">-- 請先選擇產品 --</option>';
    clearDisplays();
    if (!selectedMat) return;

    const filteredProds = [...new Set(valveData.filter(item => item.mat === selectedMat).map(item => item.prod))];
    filteredProds.forEach(prod => {
        let option = document.createElement('option');
        option.value = prod;
        option.textContent = prod;
        prodSelect.appendChild(option);
    });
}

function updateSizes() {
    const selectedMat = matSelect.value;
    const selectedProd = prodSelect.value;
    sizeSelect.innerHTML = '<option value="">-- 請選擇尺寸 --</option>';
    clearDisplays();
    if (!selectedMat || !selectedProd) return;

    const targetItem = valveData.find(item => item.mat === selectedMat && item.prod === selectedProd);
    if (!targetItem) return;

    orderedSizeList.forEach(size => {
        if (targetItem.sizes[size] !== undefined) {
            let option = document.createElement('option');
            option.value = size;
            option.textContent = size + '" 吋';
            sizeSelect.appendChild(option);
        }
    });
}

function runCalculation() {
    const selectedMat = matSelect.value;
    const selectedProd = prodSelect.value;
    const selectedSize = sizeSelect.value;
    const discValue = discInput.value;

    if (!selectedMat || !selectedProd || !selectedSize) {
        clearDisplays();
        return;
    }

    const targetItem = valveData.find(item => item.mat === selectedMat && item.prod === selectedProd);
    if (!targetItem) return;

    const originalPrice = targetItem.sizes[selectedSize];

    if (isNaN(originalPrice)) {
        baseDisplay.textContent = originalPrice;
        finalDisplay.textContent = originalPrice;
        return;
    }

    const factor = discValue !== "" ? parseFloat(discValue) : 100;
    const computedPrice = Math.round(originalPrice * (factor / 100));

    baseDisplay.textContent = "NT$ " + Number(originalPrice).toLocaleString();
    finalDisplay.textContent = "NT$ " + computedPrice.toLocaleString();
}

function clearDisplays() {
    baseDisplay.textContent = "NT$ 0";
    finalDisplay.textContent = "NT$ 0";
}

initSystem();
</script>

</body>
</html>
